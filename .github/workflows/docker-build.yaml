name: Docker Building Pipeline

"on":
  "workflow_dispatch":
  push:
    branches:
      - 'develop'
    tags:
      - '*'

env:
  BASE_IMAGE: "ghcr.io/daanselen/nginx-full:certbot-node"
  REGISTRY: "ghcr.io"
  IMAGE_NAME: nginx-proxy-manager
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      final_image_name: ${{ steps.vars.outputs.final_image_name }}

    steps:
      - id: vars
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ env.REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}"

          echo "final_image_name=${REPO}:latest" >> $GITHUB_OUTPUT

  build-latest:
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: compile VueJS frontend
        run: |
          cd ./frontend
          npm install ci
          npm run locale-extract
          npm run locale-compile
          npm run locale-sort
          npm run build

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ env.PLATFORMS }}
      - uses: docker/setup-buildx-action@v3

      - name: log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          pull: true
          push: true
          tags: ${{ needs.setup.outputs.final_image_name }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
